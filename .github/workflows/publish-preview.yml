name: Publish Preview Packages
on:
  push:
    branches:
      - "**"
    tags:
      - "!**"
  pull_request:

permissions: {}

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: a recent `latest` regressed the isolated-linker symlink
          # creation for scoped packages with periods (`@sqlite.org/sqlite-wasm`),
          # making `bun i` produce a tree where tsgo could not resolve the
          # type-only import in `packages/sqlite/src/storage/_sqlite/browser.ts`.
          bun-version: "1.3.11"
      - run: bun i
      - run: bun run build
      # Publish every workspace under packages/* and providers/* as a PR-
      # preview package, plus the cli example. `pkg-pr-new` honors the
      # `"private": true` flag on `@workglow/test`, so internal-only
      # workspaces are silently skipped. The shell expands the globs into
      # one positional argument per matched directory.
      - run: bunx pkg-pr-new publish ./packages/* ./providers/* ./examples/cli
